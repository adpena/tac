[project]
name = "tac"
version = "1.0.5"
description = "Task-Aware Codec: neural video compression optimized for downstream perception models. Includes meta-Lagrangian search engine, predictor with refusal modes, distortion proxy, and hardened preflight infrastructure for the comma video compression challenge."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alejandro Pena", email = "adpena@users.noreply.github.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "click>=8.0,<9.0",
    "brotli>=1.0",
    "constriction>=0.4,<0.5",
    "pyppmd>=1.3,<2.0",
    "cryptography>=41.0",
]

[project.urls]
Homepage = "https://github.com/adpena/tac"
"Comma Challenge" = "https://github.com/commaai/comma_video_compression_challenge"
"Submission PR #107" = "https://github.com/commaai/comma_video_compression_challenge/pull/107"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tac"]
