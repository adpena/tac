[project]
name = "tac"
version = "1.0.5"
description = "Task-Aware Codec: neural video compression optimized for downstream perception models. Includes meta-Lagrangian search engine, predictor with refusal modes, distortion proxy, and hardened preflight infrastructure for the comma video compression challenge."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alejandro Pena", email = "adpena@users.noreply.github.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "click>=8.0,<9.0",
    "brotli>=1.0",
    "constriction>=0.4,<0.5",
    "pyppmd>=1.3,<2.0",
    "cryptography>=41.0",
]

[project.urls]
Homepage = "https://github.com/adpena/tac"
Repository = "https://github.com/adpena/tac"
Issues = "https://github.com/adpena/tac/issues"
"Research Workspace" = "https://github.com/adpena/comma-lab"
"Comma Challenge" = "https://github.com/commaai/comma_video_compression_challenge"

[project.optional-dependencies]
mlx = ["mlx>=0.5"]
viz = [
    "plotly>=5.0",
    "matplotlib>=3.8",
    "pillow>=10.0",
]
notebooks = ["marimo>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tac"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",    # line length handled by formatter
    "E741",    # ambiguous variable name (E/l/I etc., often physics symbols)
    "E402",    # module-level import not at top (intentional in some entry points)
    "B008",    # function call in default argument (intentional with Click decorators)
]

[tool.ruff.lint.per-file-ignores]
"tac/preflight.py" = ["ALL"]
"tac/tests/*.py" = ["F841"]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tac/tests"]
timeout = 60
markers = [
    "slow: marks tests that load scorer models (deselect with '-m \"not slow\"')",
]
